# Mosquitto 2.x — broker de TESTE, sem autenticação e sem TLS.
# Não exponha esta configuração na internet.

# ESP32 fala MQTT puro nesta porta
listener 1883 0.0.0.0
protocol mqtt

# O navegador não fala MQTT por TCP: precisa de WebSocket
listener 9001 0.0.0.0
protocol websockets

# Sem isto o Mosquitto 2.x recusa conexão vinda da rede
allow_anonymous true

persistence false
log_type error
log_type warning
log_type notice
log_type information
